<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>book-lib</title>
</head>
<body>
    <header>
        <h1>Book_Library</h1>
        <p>Manage your personal book collection</p>
    </header>
    <main>
        <section>
            <h2>Add Book</h2>
            <form id="book-form">
                <label for="book-title">Book Title:</label>
                <input type="text" id="book-title" placeholder="Enter a book title"><br><br>
                <label for="book-author">Author:</label>
                <input type="text" id="book-author" placeholder="Enter the author's name"><br><br>
                <label for="genre">Genre</label>
                <select id="genre">
                    <option value="">Select Genre</option>
                    <option value="Fiction">Fiction</option> 
                    <option value="Fantasy">Fantasy</option> 
                    <option value="Science">Science</option> 
                    <option value="Biography">Biography</option> 
                    <option value="History">History</option> 
                    <option value="Romance">Romance</option> 
                    <option value="Self Help">Self Help</option> 
                    <option value="Other">Other</option>
                </select><br><br>
                <label for="readStatus">Read Status</label>
                <select id="readStatus"> 
                    <option value="">Select Status</option> 
                    <option value="Read">Read</option> 
                    <option value="Unread">Unread</option> 
                </select><br><br>
                <button type="submit" id="addBookButton"> Add Book </button>
        </section>
        <section> 
            <h2>Search Books</h2> 
            <label for="searchInput">Search</label> 
            <input type="text" id="searchInput" placeholder="Search by book title or author" > 
        </section>
        
    </main>
</body>
</html>
